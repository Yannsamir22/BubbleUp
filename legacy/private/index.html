<!DOCTYPE html>
<html>
  <head>
    <title>Thinkmas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="Welcome.css" />
    <link
      rel="icon"
      href="image/ThinkmasIcon.jpg"
      style="border-radius: 100%"
      type="image/x-icon"
    />
  </head>
  <body>
    <div id="app-container">
      <!-- Auth Area -->
      <div id="auth-area">
        <div id="login-view">
          <h1>Login</h1>
          <form id="login-form" action="">
            <input
              id="login-username"
              autocomplete="username"
              placeholder="Username"
              required
            />
            <input
              id="login-password"
              type="password"
              autocomplete="current-password"
              placeholder="Password"
              required
            />
            <button type="submit">Login</button>
          </form>
          <p id="login-error" class="error-message"></p>
          <p id="login-success" class="success-message"></p>
          <p class="toggle-link">
            Don't have an account?
            <a href="#" id="show-register">Register here</a>
          </p>
        </div>
        <div id="register-view" style="display: none">
          <h1>Register</h1>
          <form id="register-form" action="">
            <input
              id="register-username"
              autocomplete="username"
              placeholder="Username (3-15 chars, letters/numbers/_)"
              required
            />
            <input
              id="register-password"
              type="password"
              autocomplete="new-password"
              placeholder="Password (min 6 chars)"
              required
            />
            <input
              id="register-password-confirm"
              type="password"
              autocomplete="new-password"
              placeholder="Confirmation Password (min 6 chars)"
              required
            />
            <button type="submit">Register</button>
          </form>
          <p id="register-error" class="error-message"></p>
          <p class="toggle-link">
            Already have an account? <a href="#" id="show-login">Login here</a>
          </p>
        </div>
      </div>

      <!-- Chat Area -->
      <div id="chat-area" style="display: none">
        <div id="chat-content">
          <div id="user-list-area">
            <h2>Online Users</h2>
            <ul id="user-list"></ul>
          </div>
          <div id="message-area">
            <h1>Thinkmas Chat Room</h1>
            <!-- Updated title -->
            <ul id="messages"></ul>
            <form id="message-form" action="">
              <input
                id="message-input"
                autocomplete="off"
                placeholder="Type message, #help, /w user, or admin commands..."
              />
              <!-- Updated placeholder -->
              <button type="submit">Send</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <!-- end app-container-main -->

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
  </body>
</html>
